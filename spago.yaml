# Minimal Spago config for the Grammark bootstrap modules.
# Build locally with:  npm i -g purescript spago  &&  spago build
# (The packageSet registry version may need bumping to a current release.)
package:
  name: grammark
  publish:
    version: 0.0.0
    license: Apache-2.0
    location:
      githubOwner: wstein
      githubRepo: grammark
  dependencies:
    - prelude
    - arrays
    - maybe
    - either # Data.Either
    - tuples
    - strings # Data.String / Data.String.CodeUnits (lexer)
    - ordered-collections # Data.Map / Data.Set
    - foldable-traversable # Data.Foldable / Data.FoldableWithIndex
  test:
    main: Test.Main
    dependencies:
      - effect # Effect
      - console # Effect.Console
      - assert # Test.Assert
workspace:
  packageSet:
    registry: 66.0.0
