# Spago config for Gramaire: the full core — lexer, three table methods,
# parser, codegen, gramaire-ir + decoder, EBNF backend, diagnostics — plus the
# native CLI. The core library is filesystem-free; only `Gramaire.Cli` and
# `Gramaire.Codegen.Main` import node-fs/node-buffer, so the parser/IR import
# cleanly into a browser/worker (incremental-spec §9, ADR D13).
# Build locally with:  npm i -g purescript spago  &&  spago build
# Package-set registry 66.0.0 is pinned and resolves clean under
# --pedantic-packages; CI caches .spago + output across runs.
package:
  name: gramaire
  publish:
    version: 0.0.0
    license: Apache-2.0
    location:
      githubOwner: wstein
      githubRepo: gramaire
  dependencies:
    - arrays
    - console # Effect.Console (CLI output)
    - effect # Effect (CLI)
    - either # Data.Either
    - exceptions # Effect.Exception (CLI: graceful file-read failure)
    - foldable-traversable # Data.Foldable / Data.FoldableWithIndex
    - integers
    - maybe
    - node-buffer # Node.Encoding (CLI)
    - node-fs # Node.FS.Sync / Node.FS.Perms (CLI reads/writes files)
    - ordered-collections # Data.Map / Data.Set
    - prelude
    - strings # Data.String / Data.String.CodeUnits (lexer)
    - tuples
  test:
    main: Test.Main
    dependencies:
      - assert # Test.Assert
workspace:
  packageSet:
    registry: 66.0.0
