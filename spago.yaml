# Minimal Spago config for the Grammark bootstrap modules.
# Build locally with:  npm i -g purescript spago  &&  spago build
# (The packageSet registry version may need bumping to a current release.)
package:
  name: grammark
  publish:
    version: 0.0.0
    license: Apache-2.0
    location:
      githubOwner: wstein
      githubRepo: grammark
  dependencies:
    - arrays
    - console # Effect.Console (CLI output)
    - effect # Effect (CLI)
    - either # Data.Either
    - exceptions # Effect.Exception (CLI: graceful file-read failure)
    - foldable-traversable # Data.Foldable / Data.FoldableWithIndex
    - integers
    - maybe
    - node-buffer # Node.Encoding (CLI)
    - node-fs # Node.FS.Sync / Node.FS.Perms (CLI reads/writes files)
    - ordered-collections # Data.Map / Data.Set
    - prelude
    - strings # Data.String / Data.String.CodeUnits (lexer)
    - tuples
  test:
    main: Test.Main
    dependencies:
      - assert # Test.Assert
workspace:
  packageSet:
    registry: 66.0.0
