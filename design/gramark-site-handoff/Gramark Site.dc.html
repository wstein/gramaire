<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --font-ui:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme:light;
    --bg:#ffffff; --bg-1:#f5faf7; --bg-2:#edf5f0; --bg-3:#e0efe7;
    --fg:#16181d; --fg-secondary:#1f3a31; --fg-muted:#566860; --fg-faint:#7d8d85;
    --border:#dde9e3; --border-strong:#c6dbd0;
    --accent:#0a8f63; --accent-2:#066b4a; --node:#15b879;
    --accent-soft:color-mix(in srgb,var(--accent) 16%,var(--bg));
    --accent-softer:color-mix(in srgb,var(--accent) 8%,var(--bg));
    --t-nonterm:var(--accent); --t-term:#b4530a; --t-action:#6f42c1; --t-op:#7d8d85; --t-comment:#7d8d85;
    --out-bg:#0c130f; --out-fg:#e8f1ec;
    --radius:6px; --radius-lg:10px;
    --shadow-card:0 1px 2px rgba(22,24,29,.04),0 8px 26px -16px rgba(10,143,99,.28);
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --bg:#0e1512; --bg-1:#131c18; --bg-2:#1a2620; --bg-3:#24332b;
    --fg:#eaf2ed; --fg-secondary:#c2d4ca; --fg-muted:#8ea298; --fg-faint:#73877e;
    --border:#25332c; --border-strong:#38493f;
    --accent:#34d399; --accent-2:#6ee7b7; --node:#15b879;
    --t-nonterm:var(--accent); --t-term:#f0a868; --t-action:#c4a8ec; --t-op:#73877e; --t-comment:#73877e;
    --out-bg:#080d0a; --out-fg:#e8f1ec;
    --shadow-card:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;color:var(--fg)}
  ::selection{background:color-mix(in srgb,var(--accent) 26%,transparent)}
  .gx-switch-knob{transition:transform .22s ease}
  [data-theme="dark"] .gx-switch-knob{transform:translateX(21px)}
  textarea.gx-src{outline:none}
  textarea.gx-src:focus{box-shadow:inset 2px 0 0 var(--accent)}
  .gx-scroll::-webkit-scrollbar{width:10px;height:10px}
  .gx-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}
  .gx-scroll::-webkit-scrollbar-track{background:transparent}
</style>
</helmet>

<div style="height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--font-ui)">
  <div style="display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid var(--border);flex:none;z-index:10">
    <div onClick="{{ goHome }}" style="display:flex;align-items:center;gap:9px;cursor:pointer">
      <dc-import name="GramarkMark" hint-size="28px,28px" style="display:block;width:28px;height:28px"></dc-import>
      <div style="font-size: 21px; width: 83px; height: 28px"><dc-import name="GramarkWordmark" hint-size="118px,22px" style="font-size: 19px"></dc-import></div>
    </div>
    <div style="flex:1"></div>
    {{ navItems }}
    <div style="width:1px;height:18px;background:var(--border)"></div>
    <div onClick="{{ toggleTheme }}" title="Toggle light / dark" class="gx-switch" style="cursor:pointer;width:46px;height:25px;border-radius:999px;background:var(--bg-2);border:1px solid var(--border-strong);position:relative;flex:none">
      <span style="position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:11px;line-height:1;color:var(--fg-faint)">☀</span>
      <span style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;line-height:1;color:var(--fg-faint)">☾</span>
      <span class="gx-switch-knob" style="position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.35)"></span>
    </div>
  </div>
  <div style="flex:1;min-height:0;display:flex;flex-direction:column">{{ pageContent }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
const EXAMPLES = {
  calc: { file:"calc.grmk.md", input:"2 + 3 * 4", text:
`/**
 * Calc-js
 *
 * An arithmetic calculator that evaluates its own input —
 * a demonstration of inline \`{% … %}\` actions.
 */

%lang javascript

NUMBER : /[0-9]+(?:\\.[0-9]+)?/
WS     : /[ \\t\\r\\n]+/   %skip

Expr
  : Expr '+' Term   {% (c) => c.expr + c.term %}
  | Expr '-' Term   {% (c) => c.expr - c.term %}
  | Term

Term
  : Term '*' Factor   {% (c) => c.term * c.factor %}
  | Term '/' Factor   {% (c) => c.term / c.factor %}
  | Factor

Factor
  : '(' Expr ')'  {% (c) => c.expr %}
  | NUMBER        {% (c) => parseFloat(c.number) %}
` },
  json: { file:"json.grmk.md", input:"{ string : number }", text:
`# JSON (RFC 8259), condensed

Value
  : Object
  | Array
  | \`string\`
  | \`number\`
  | \`true\`
  | \`false\`
  | \`null\`

Object
  : \`{\` Members \`}\`

Members
  : Pair
  | Pair \`,\` Members

Pair
  : \`string\` \`:\` Value

Array
  : \`[\` Elements \`]\`

Elements
  : Value
  | Value \`,\` Elements
` },
  lr: { file:"lr.grmk.md", input:"name : sym sym", text:
`# lr — Gramark's own notation, condensed

Rule
  : Name Alts

Name
  : \`name\`

Alts
  : \`:\` Seq
  | \`|\` Seq

Seq
  : Symbol Seq
  | Symbol

Symbol
  : \`sym\`
` },
};

const TUT = [
  { title:"1 · One rule, a few choices",
    body:"A grammar is a set of rules. Each rule names a nonterminal and lists its productions — the alternatives, separated by | . Here a Digit is one of three literals (terminals are wrapped in `backticks`). Edit it — add a 3 — and the railroad redraws.",
    seed:`Digit\n  : \`0\`\n  | \`1\`\n  | \`2\`\n`, focus:"Digit", ex:null },
  { title:"2 · Sequencing symbols",
    body:"Put symbols in a row to require them in order. A Pair is two Digits, one after another — the diagram becomes a straight track through both boxes. Nonterminals (Digit) are clickable boxes; terminals are pills.",
    seed:`Pair\n  : Digit Digit\n\nDigit\n  : \`0\`\n  | \`1\`\n`, focus:"Pair", ex:null },
  { title:"3 · Recursion makes lists",
    body:"A rule can refer to itself. Digits is a Digit followed by more Digits, or a single Digit — that recursion is how grammars express “one or more.” Gramark builds IELR(1) tables, so left- or right-recursion is fine.",
    seed:`Digits\n  : Digit Digits\n  | Digit\n\nDigit\n  : \`0\`\n  | \`1\`\n`, focus:"Digits", ex:null },
  { title:"4 · Terminals & semantic actions",
    body:"Between {% and %} you attach a semantic action — raw code carried verbatim to codegen. It never affects the diagram. This is the classic expression grammar; open it in the Lab to explore FIRST/FOLLOW across every rule.",
    seed:`Expr\n  : Expr \`+\` Term   {% Add %}\n  | Term\n\nTerm\n  : \`num\`\n`, focus:"Expr", ex:"calc" },
];

const DOCS = [
  { id:"overview", label:"Overview" },
  { id:"format", label:"The .grmk.md format" },
  { id:"fences", label:"lr fences" },
  { id:"ff", label:"FIRST / FOLLOW" },
  { id:"cli", label:"CLI" },
];

class Component extends DCLogic {
  state = {
    page:'home', theme:'light', docSection:'overview',
    labExample:'calc', labText:EXAMPLES.calc.text, labRule:'Expr', labInput:EXAMPLES.calc.input, labTab:'result', labMethod:'IELR',
    homeText: 'Expr\n  : Expr `+` Term   {% Add %}\n  | Expr `-` Term   {% Sub %}\n  | Term\n',
    labSplit:55, hoverTok:-1, collapsed:{}, labStart:'', labStep:0, hoverRule:'', copied:false,
    tutStep:0, tutTexts:{0:TUT[0].seed,1:TUT[1].seed,2:TUT[2].seed,3:TUT[3].seed},
  };
  componentDidMount(){ this.applyTheme(); }
  applyTheme(){ try{ document.documentElement.setAttribute('data-theme', this.state.theme); }catch(e){} }
  toggleTheme = () => this.setState(s=>({theme:s.theme==='dark'?'light':'dark'}), ()=>this.applyTheme());
  setPage = (p) => this.setState({page:p});
  goHome = () => this.setState({page:'home'});
  setDoc = (id) => this.setState({docSection:id});
  setTutStep = (i) => this.setState({tutStep:i});
  onTutInput = (i,v) => this.setState(s=>({tutTexts:{...s.tutTexts,[i]:v}}));
  openInLab = (text, rule, input) => { const rules=this.parse(text); const r = rule && rules.some(x=>x.name===rule)?rule:(rules[0]?rules[0].name:''); let key=''; let inp = input!=null?input:''; for(const k in EXAMPLES){ if(EXAMPLES[k].text===text){ key=k; if(input==null) inp=EXAMPLES[k].input; } } this.setState({page:'lab', labExample:key, labText:text, labRule:r, labInput:inp, labTab:'result', labStart:''}); };
  loadExample = (name) => { const ex=EXAMPLES[name]; if(!ex)return; const rules=this.parse(ex.text); this.setState({labExample:name, labText:ex.text, labRule:rules[0]?rules[0].name:'', labInput:ex.input, labStart:''}); };
  onLabInput = (e) => { const text=e.target.value; const rules=this.parse(text); const ok=rules.some(r=>r.name===this.state.labRule); this.setState({labText:text, labExample:'', labRule:ok?this.state.labRule:(rules[0]?rules[0].name:'')}); };
  onLabInputText = (e) => this.setState({labInput:e.target.value});
  setLabTab = (t) => this.setState({labTab:t});
  setLabMethod = (m) => this.setState({labMethod:m});
  setLabStart = (e) => this.setState({labStart:e.target.value});
  setLabStep = (n) => this.setState({labStep:n});
  buildWalk(tr){ let stack=[],cursor=0; const steps=[];
    tr.forEach(s=>{ if(s.kind==='shift'){ const before=stack.slice(); stack.push('`'+s.text+'`'); steps.push({action:'shift',sym:'`'+s.text+'`',cursor,after:stack.slice()}); cursor++; }
      else { const k=s.rhs.length; const before=stack.slice(); stack.splice(stack.length-k,k); stack.push(s.rule); steps.push({action:'reduce',rule:s.rule,rhs:s.rhs,cursor,after:stack.slice(),popped:k}); } });
    steps.push({action:'accept',cursor,after:stack.slice()});
    return steps;
  }
  selectLabRule = (name) => this.setState({labRule:name});
  onHomeInput = (e) => this.setState({homeText:e.target.value});
  setHover = (i) => { if(this.state.hoverTok!==i) this.setState({hoverTok:i}); };
  setHoverRule = (r) => { if(this.state.hoverRule!==r) this.setState({hoverRule:r}); };
  ruleLines(text, rn){ const lines=(text||'').split('\n'); const out=[];
    for(let i=0;i<lines.length;i++){ const tt=lines[i].trim(); if(!tt||tt[0]==='#'||tt[0]===':'||tt[0]==='|') continue;
      if(tt.split(/\s+/)[0]===rn){ out.push(i); for(let j=i+1;j<lines.length;j++){ const t2=lines[j].trim(); if(t2 && (t2[0]===':'||t2[0]==='|')) out.push(j); else break; } break; } }
    return out;
  }
  startDrag = (e) => { e.preventDefault(); const el=this._splitRef; const move=(ev)=>{ if(!el) return; const r=el.getBoundingClientRect(); let p=((ev.clientX-r.left)/r.width)*100; p=Math.max(28,Math.min(72,p)); this.setState({labSplit:p}); }; const up=()=>{ window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); }; window.addEventListener('mousemove',move); window.addEventListener('mouseup',up); };
  indexLeaves = (node,c) => { c=c||{n:0}; if(node.leaf!=null){ node.idx=c.n++; return c.n; } node.kids.forEach(k=>this.indexLeaves(k,c)); return c.n; };
  _diagRow(kind,title,desc,RED){ const R=React; const col=kind==='err'?RED:kind==='warn'?'#b4530a':'var(--accent)'; const ic=kind==='err'?'✕':kind==='warn'?'!':'✓';
    return R.createElement('div',{key:title,style:{display:'flex',gap:'12px',alignItems:'flex-start',padding:'12px 14px',border:'1px solid var(--border)',borderRadius:'8px',background:'var(--bg-1)'}},[
      R.createElement('span',{key:'i',style:{width:'20px',height:'20px',flex:'none',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',color:'#fff',background:col}},ic),
      R.createElement('div',{key:'t'},[R.createElement('div',{key:'a',style:{fontWeight:600,fontSize:'13px'}},title),R.createElement('div',{key:'b',style:{fontSize:'12.5px',color:'var(--fg-muted)',marginTop:'2px',fontFamily:'var(--font-mono)'}},desc)])]);
  }

  tokenizeProd(body){
    const toks=[]; const re=/'([^']*)'|`([^`]*)`|(\S+)/g; let m;
    while((m=re.exec(body))!==null){
      if(m[1]!=null) toks.push({type:'t',text:m[1]});
      else if(m[2]!=null) toks.push({type:'t',text:m[2]});
      else toks.push({type:'nt',text:m[3]});
    }
    return toks;
  }
  parse(text){
    let src=(text||'').replace(/\/\*[\s\S]*?\*\//g,'');
    const lines=src.split('\n'); const rules=[]; let cur=null; const lexRules=[]; let lang=null;
    for(const raw of lines){
      const t=raw.trim(); if(!t) continue;
      if(t.slice(0,2)==='//'||t[0]==='#') continue;
      if(t[0]==='%'){ const lm=t.match(/^%lang\s+(\w+)/); if(lm) lang=lm[1]; continue; }
      if(t[0]===':'||t[0]==='|'){ if(!cur)continue;
        let action=null; const am=t.match(/\{%([\s\S]*?)%\}/); if(am) action=am[1].trim();
        const body=t.slice(1).replace(/\{%[\s\S]*?%\}/g,'').trim();
        const toks=this.tokenizeProd(body);
        if(toks.length){ toks.action=action; cur.alts.push(toks); }
        continue;
      }
      const lx=t.match(/^([A-Za-z_][\w]*)\s*:\s*\/(.+)\/\s*(%skip)?\s*$/);
      if(lx){ lexRules.push({name:lx[1],regex:lx[2],skip:!!lx[3]}); continue; }
      cur={name:t.split(/\s+/)[0], alts:[]}; rules.push(cur);
    }
    rules._lex=lexRules; rules._lang=lang;
    return rules;
  }
  analyze(rules){
    const map={}; const names=new Set(); rules.forEach(r=>{map[r.name]=r;names.add(r.name);});
    const isNT=(tok)=>tok.type==='nt'&&names.has(tok.text);
    const fc={}; const first=(name,seen)=>{ if(fc[name])return fc[name]; seen=seen||new Set(); if(seen.has(name))return new Set(); seen.add(name);
      const out=new Set(); const r=map[name]; if(r) r.alts.forEach(a=>{ const s=a[0]; if(!s)return; if(isNT(s)) first(s.text,seen).forEach(x=>out.add(x)); else out.add(s.text); }); fc[name]=out; return out; };
    const firstOf=(tok)=> isNT(tok)?first(tok.text):new Set([tok.text]);
    names.forEach(n=>first(n));
    const follow={}; names.forEach(n=>follow[n]=new Set()); if(rules[0]) follow[rules[0].name].add('$');
    for(let p=0;p<8;p++){ rules.forEach(r=>r.alts.forEach(a=>{ for(let i=0;i<a.length;i++){ const s=a[i]; if(!isNT(s))continue; if(i<a.length-1) firstOf(a[i+1]).forEach(x=>follow[s.text].add(x)); else follow[r.name].forEach(x=>follow[s.text].add(x)); } })); }
    const terms=new Set(); rules.forEach(r=>r.alts.forEach(a=>a.forEach(t=>{ if(!isNT(t)) terms.add(t.text); })));
    return {map,names,isNT,first,follow,terms,rules};
  }
  tokW(tok){ const l=(tok.text||'').length; return tok.type==='t'?Math.max(28,l*8+16):Math.max(46,l*8+20); }
  nodeEl(tok,x,y,w,key,info,onPick){
    const R=React;
    if(tok.type==='t') return R.createElement('g',{key},[
      R.createElement('rect',{key:'r',x,y:y-14,width:w,height:28,rx:14,fill:'var(--bg-2)',stroke:'var(--border-strong)',strokeWidth:1.5}),
      R.createElement('text',{key:'t',x:x+w/2,y,textAnchor:'middle',dominantBaseline:'central',fill:'var(--t-term)',fontFamily:"'IBM Plex Mono', monospace",fontSize:13,fontWeight:600},tok.text)]);
    const known=info&&info.names.has(tok.text)&&onPick;
    return R.createElement('g',{key,style:{cursor:known?'pointer':'default'},onClick:known?()=>onPick(tok.text):undefined},[
      R.createElement('rect',{key:'r',x,y:y-15,width:w,height:30,rx:6,fill:'color-mix(in srgb, var(--accent) 8%, var(--bg))',stroke:'var(--accent)',strokeWidth:1.6}),
      R.createElement('text',{key:'t',x:x+w/2,y,textAnchor:'middle',dominantBaseline:'central',fill:'var(--accent)',fontFamily:"'IBM Plex Mono', monospace",fontSize:13,fontWeight:600},tok.text)]);
  }
  buildDiagram(rule,info,onPick){
    const R=React;
    if(!rule||!rule.alts.length) return R.createElement('div',{style:{color:'var(--fg-faint)',fontFamily:'var(--font-mono)',fontSize:'12px'}},'no productions');
    const gap=18,lead=14,stroke='var(--fg-faint)';
    const rows=rule.alts.map(alt=>{ let x=0; const nodes=alt.map(tok=>{const w=this.tokW(tok);const n={x,w,tok};x+=w+gap;return n;}); return {nodes,contentW:Math.max(0,x-gap)}; });
    const maxC=Math.max(40,...rows.map(r=>r.contentW));
    const LX=46,contentX=LX+lead,RX=contentX+maxC+lead,startX=16,endX=RX+30,W=endX+14;
    const rowH=52,topY=28,H=topY+(rows.length-1)*rowH+26; const kids=[];
    const line=(d,key)=>R.createElement('path',{key,d,fill:'none',stroke,strokeWidth:1.6,strokeLinecap:'round'});
    rows.forEach((row,i)=>{ const y=topY+i*rowH; let prevR=null;
      row.nodes.forEach((n,j)=>{ const nx=contentX+n.x;
        if(j===0){ if(i===0) kids.push(line(`M${startX} ${y} H${nx}`,`ld${i}`)); else kids.push(line(`M${LX} ${topY} V${y-9} Q${LX} ${y} ${LX+9} ${y} H${nx}`,`ld${i}`)); }
        else kids.push(line(`M${prevR} ${y} H${nx}`,`c${i}-${j}`));
        kids.push(this.nodeEl(n.tok,nx,y,n.w,`n${i}-${j}`,info,onPick)); prevR=nx+n.w; });
      if(prevR===null) prevR=(i===0?startX:LX+9);
      if(i===0) kids.push(line(`M${prevR} ${y} H${endX}`,`tl${i}`)); else kids.push(line(`M${prevR} ${y} H${RX-9} Q${RX} ${y} ${RX} ${y-9} V${topY}`,`tl${i}`));
    });
    kids.push(R.createElement('circle',{key:'s',cx:startX,cy:topY,r:4,fill:'var(--accent)'}));
    kids.push(R.createElement('circle',{key:'e',cx:endX,cy:topY,r:4,fill:'var(--accent)'}));
    return R.createElement('svg',{viewBox:`0 0 ${W} ${H}`,style:{display:'block',width:'100%',maxWidth:W+'px',height:'auto'}},kids);
  }

  // ---------- shared UI helpers ----------
  btn(label,onClick,kind){
    const R=React; const base={display:'inline-flex',alignItems:'center',gap:'8px',fontWeight:600,fontSize:'14.5px',padding:'11px 19px',borderRadius:'var(--radius)',cursor:'pointer',textDecoration:'none',whiteSpace:'nowrap'};
    const styles = kind==='primary'?{...base,background:'var(--accent)',color:'#fff'}
      : kind==='ghost'?{...base,background:'transparent',color:'var(--fg-secondary)',border:'1px solid var(--border-strong)'}
      : {...base,padding:'7px 13px',fontSize:'12.5px',background:'var(--accent-softer)',color:'var(--accent)',border:'1px solid color-mix(in srgb,var(--accent) 26%,transparent)',fontFamily:'var(--font-mono)',fontWeight:500};
    return R.createElement('span',{onClick,style:styles},label);
  }
  codeBlock(text,small){
    const R=React; const lines=text.split('\n');
    return R.createElement('pre',{style:{margin:0,fontFamily:'var(--font-mono)',fontSize:(small?12.5:13.5)+'px',lineHeight:1.7,whiteSpace:'pre-wrap',color:'var(--fg-secondary)'}},
      lines.map((ln,i)=>R.createElement('div',{key:i},this.hl(ln))));
  }
  hl(line){
    const R=React; if(/^\s*#/.test(line)) return R.createElement('span',{style:{color:'var(--t-comment)'}},line);
    const parts=[]; const re=/(`[^`]*`)|(\{%[\s\S]*?%\})|(^[A-Za-z_][\w]*)|([:|])|(\s+)|([^\s`:|]+)/g; let m,k=0;
    while((m=re.exec(line))!==null){
      if(m[1]) parts.push(R.createElement('span',{key:k++,style:{color:'var(--t-term)'}},m[1]));
      else if(m[2]) parts.push(R.createElement('span',{key:k++,style:{color:'var(--t-action)'}},m[2]));
      else if(m[3]) parts.push(R.createElement('span',{key:k++,style:{color:'var(--accent)',fontWeight:600}},m[3]));
      else if(m[4]) parts.push(R.createElement('span',{key:k++,style:{color:'var(--t-op)'}},m[4]));
      else parts.push(m[0]);
    }
    return parts;
  }

  // ---------- pages ----------
  homeView(){
