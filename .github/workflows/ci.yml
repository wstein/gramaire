name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Scala core (cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Coursier and sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('project/build.properties', 'project/plugins.sbt', 'build.sbt') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Cross-compile check (catches JVM-only stdlib leaks into core/shared)
        run: sbt coreJVM/compile coreJS/compile playground/compile cli/compile

      - name: Format check (scalafmt)
        run: sbt scalafmtCheckAll

      - name: Core stays I/O-free (ADR D13 equivalent)
        # Belt-and-suspenders: `coreJS/compile` succeeding is itself a
        # stronger, compiler-enforced version of this guarantee (Scala.js
        # has no java.io/java.nio to call), but keep this fast, readable,
        # explicit check as the first line of defense too.
        run: |
          hits=$(grep -rlE 'java\.(io|nio)\.|scala\.io\.Source' core/src/main/scala || true)
          if [ -n "$hits" ]; then
            echo "core/src/main/scala must stay I/O-free (ADR D13 equivalent):"
            echo "$hits"
            exit 1
          fi

      - name: Test (cross-platform, JVM + Scala.js from one shared suite)
        run: sbt coreJVM/test coreJS/test

  cli:
    name: Unified CLI (gramaire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Coursier and sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('project/build.properties', 'project/plugins.sbt', 'build.sbt') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Unit tests
        run: sbt cli/test

      - name: gramaire check grammar and examples
        run: |
          sbt -batch "cli/runMain gramaire.cli.Main check grammar/lr.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main check examples/calc.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main check examples/calc-prec.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main check examples/json.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main check examples/readme.gram.md"

      - name: Derived artifacts are up to date (no drift)
        run: |
          sbt -batch "cli/runMain gramaire.cli.Main fmt --diagrams=sidecar grammar/lr.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main fmt --diagrams=sidecar examples/calc.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main fmt --diagrams=sidecar examples/calc-prec.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main fmt --diagrams=sidecar examples/json.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main fmt --diagrams=sidecar examples/readme.gram.md"
          git diff --exit-code

  docs-lint:
    name: Markdown lint (repo-wide)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs-lint/package-lock.json

      - name: Install lint dependencies
        run: npm ci

      - name: Lint Markdown (markdownlint-cli2)
        run: npm run lint:md

  site:
    name: Playground site (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Coursier and sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('project/build.properties', 'project/plugins.sbt', 'build.sbt') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Engine bundle is up to date (rebuild + no drift, ADR D13)
        # `gramaire.playground.Main.evaluate` → Scala.js browser ESM
        # (`sbt playground/fullLinkJS`). If this fails, run
        # `npm run build:engine` in site/ and commit the regenerated bundle.
        run: npm run check:engine

      - name: Site-glue bundles are up to date (rebuild + no drift)
        # The site's logic-bearing TypeScript is now Scala.js
        # (`site-glue`/`engineWorker`, Phase 5). If this fails, run
        # `npm run build:site-glue` in site/ and commit the regenerated bundles.
        run: npm run check:site-glue

      - name: Check formatting (prettier)
        run: npm run lint

      - name: Unit tests (the real engine, via the bundle)
        run: npm test

      - name: Build the site
        run: npm run build
