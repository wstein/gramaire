name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  purescript:
    name: PureScript core (Spago)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache Spago packages and output
        uses: actions/cache@v6
        with:
          path: |
            .spago
            output
          key: spago-${{ runner.os }}-${{ hashFiles('spago.yaml', 'spago.lock') }}
          restore-keys: |
            spago-${{ runner.os }}-

      - name: Install the PureScript toolchain
        run: npm i -g purescript@0.15.16 spago@1.0.4

      - name: Build (warnings are errors; deps must be tidy)
        run: spago build --strict --pedantic-packages

      - name: Format check (purs-tidy)
        # Pinned for determinism; excludes the generated reduce, which is
        # codegen-shaped (and drift-locked by Test.Codegen), not purs-tidy-shaped.
        run: |
          files=$(find src test -name '*.purs' -not -path '*/Generated/*')
          npx --yes purs-tidy@0.11.0 check $files

      - name: Core stays filesystem-free (ADR D13)
        # The parser/IR/runtime must import cleanly into a browser/worker, so no
        # core module may depend on Node's fs. Only the CLI and the codegen
        # regeneration entry point are allowed to. This guards the boundary the
        # browser/playground goal relies on before FS coupling can spread.
        run: |
          hits=$(grep -rlE 'Node\.(FS|Buffer)' src/Gramaire --include='*.purs' \
            | grep -vE 'Gramaire/Cli\.purs|Gramaire/Codegen/Main\.purs' || true)
          if [ -n "$hits" ]; then
            echo "These core modules import Node.FS/Buffer — keep the core filesystem-free (ADR D13):"
            echo "$hits"
            exit 1
          fi

      - name: Test
        run: spago test

  core:
    name: Scala core (cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Coursier and sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('project/build.properties', 'project/plugins.sbt', 'build.sbt') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Cross-compile check (catches JVM-only stdlib leaks into core/shared)
        run: sbt coreJVM/compile coreJS/compile playground/compile cli/compile

      - name: Format check (scalafmt)
        run: sbt scalafmtCheckAll

      - name: Core stays I/O-free (ADR D13 equivalent)
        # Belt-and-suspenders: `coreJS/compile` succeeding is itself a
        # stronger, compiler-enforced version of this guarantee (Scala.js
        # has no java.io/java.nio to call), but keep this fast, readable,
        # explicit check as the first line of defense too.
        run: |
          hits=$(grep -rlE 'java\.(io|nio)\.|scala\.io\.Source' core/src/main/scala || true)
          if [ -n "$hits" ]; then
            echo "core/src/main/scala must stay I/O-free (ADR D13 equivalent):"
            echo "$hits"
            exit 1
          fi

      - name: Test (cross-platform, JVM + Scala.js from one shared suite)
        run: sbt coreJVM/test coreJS/test

  cli:
    name: Unified CLI (gramaire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Coursier and sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('project/build.properties', 'project/plugins.sbt', 'build.sbt') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Unit tests
        run: sbt cli/test

      - name: gramaire check grammar and examples
        run: |
          sbt -batch "cli/runMain gramaire.cli.Main check grammar/lr.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main check examples/calc.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main check examples/calc-prec.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main check examples/json.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main check examples/readme.gram.md"

      - name: Derived artifacts are up to date (no drift)
        run: |
          sbt -batch "cli/runMain gramaire.cli.Main fmt --diagrams=sidecar grammar/lr.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main fmt --diagrams=sidecar examples/calc.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main fmt --diagrams=sidecar examples/calc-prec.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main fmt --diagrams=sidecar examples/json.gram.md"
          sbt -batch "cli/runMain gramaire.cli.Main fmt --diagrams=sidecar examples/readme.gram.md"
          git diff --exit-code

  docs-lint:
    name: Markdown lint (repo-wide)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs-lint/package-lock.json

      - name: Install lint dependencies
        run: npm ci

      - name: Lint Markdown (markdownlint-cli2)
        run: npm run lint:md

  bootstrap:
    name: Bootstrap bridge + grammar checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bootstrap
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # Node 24+ runs the TypeScript bridge directly (native type
          # stripping) and provides import.meta.main + top-level await.
          node-version: "24"
          cache: npm
          cache-dependency-path: bootstrap/package-lock.json

      - name: Install bridge dependencies
        run: npm ci

      - name: Check formatting (prettier)
        run: npm run format:check

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (node:test)
        run: npm test

      - name: Lint Markdown (markdownlint-cli2)
        run: npm run lint:md

      - name: gramaire --check grammar and examples
        working-directory: ${{ github.workspace }}
        run: |
          node bootstrap/gramaire-check.ts grammar/lr.gram.md
          node bootstrap/gramaire-check.ts examples/calc.gram.md
          node bootstrap/gramaire-check.ts examples/calc-prec.gram.md
          node bootstrap/gramaire-check.ts examples/json.gram.md
          node bootstrap/gramaire-check.ts examples/readme.gram.md

      - name: Derived artifacts are up to date (no drift)
        working-directory: ${{ github.workspace }}
        run: |
          node bootstrap/gramaire-check.ts --write-lock grammar/lr.gram.md
          node bootstrap/gramaire-check.ts --write-lock examples/calc.gram.md
          node bootstrap/gramaire-check.ts --write-lock examples/calc-prec.gram.md
          node bootstrap/gramaire-check.ts --write-lock examples/json.gram.md
          node bootstrap/gramaire-check.ts --write-lock examples/readme.gram.md
          git diff --exit-code

  site:
    name: Playground site (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Coursier and sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('project/build.properties', 'project/plugins.sbt', 'build.sbt') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Engine bundle is up to date (rebuild + no drift, ADR D13)
        # `gramaire.playground.Main.evaluate` → Scala.js browser ESM
        # (`sbt playground/fullLinkJS`). If this fails, run
        # `npm run build:engine` in site/ and commit the regenerated bundle.
        run: npm run check:engine

      - name: Check formatting (prettier)
        run: npm run lint

      - name: Unit tests (the real engine, via the bundle)
        run: npm test

      - name: Build the site
        run: npm run build
