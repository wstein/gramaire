name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Scala core & lab (cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: sbt/setup-sbt@v1

      - name: Cache Coursier and sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('project/build.properties', 'project/plugins.sbt', 'build.sbt') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Cross-compile check (catches JVM-only stdlib leaks into core/shared)
        run: sbt coreJVM/compile coreJS/compile labJVM/compile labJS/compile cli/compile

      - name: Format check (scalafmt)
        run: sbt scalafmtCheckAll

      - name: Core stays I/O-free (ADR D13 equivalent)
        # Belt-and-suspenders: `coreJS/compile` succeeding is itself a
        # stronger, compiler-enforced version of this guarantee (Scala.js
        # has no java.io/java.nio to call), but keep this fast, readable,
        # explicit check as the first line of defense too.
        run: |
          hits=$(grep -rlE 'java\.(io|nio)\.|scala\.io\.Source' core/src/main/scala || true)
          if [ -n "$hits" ]; then
            echo "core/src/main/scala must stay I/O-free (ADR D13 equivalent):"
            echo "$hits"
            exit 1
          fi

      - name: Test (cross-platform, JVM + Scala.js from one shared suite)
        run: sbt coreJVM/test coreJS/test labJVM/test labJS/test

  cli:
    name: Unified CLI (gramaire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: sbt/setup-sbt@v1

      - name: Cache Coursier and sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('project/build.properties', 'project/plugins.sbt', 'build.sbt') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Unit tests
        run: sbt cli/test

      # Both steps below run through the Makefile's `check-examples`/`regen-examples` targets
      # (Makefile:127-138) rather than a hand-maintained file list here — that list previously
      # drifted out of sync with GramaireCheckSuite.scala's own gated-file set (calc-js.gram.md and
      # antlr4.gram.md were added there but never wired into CI) with nothing to catch it. The
      # Makefile discovers every `.gram.md`/standalone `.gram` example by globbing
      # (`EXAMPLE_FILES`/`NATIVE_EXAMPLE_FILES`), so a newly gated file is covered automatically —
      # --inline-source is baked into `regen-examples`'s own `.gram.md` sweep (these are small
      # teaching examples, kept fully visible on purpose; source collapsing is for grammars large
      # enough that a wall of fences is harder to scan than a wall of diagrams, e.g.
      # examples/ECMA-404.gram.md, deliberately excluded from this set).
      - name: gramaire check grammar and examples
        run: make check-examples

      - name: Derived artifacts are up to date (no drift)
        run: |
          make regen-examples
          git diff --exit-code

  docs-lint:
    name: Markdown lint (repo-wide)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs-lint/package-lock.json

      - name: Install lint dependencies
        run: npm ci

      - name: Lint Markdown (markdownlint-cli2)
        run: npm run lint:md

  site:
    name: Site (Astro + Starlight)
    runs-on: ubuntu-latest
    env:
      CI: "true"
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: sbt/setup-sbt@v1

      - name: Cache Coursier and sbt
        # Same cache as the core/lab job — building the Lab engine here
        # needs sbt too (npm run build:engine shells out to it).
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('project/build.properties', 'project/plugins.sbt', 'build.sbt') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Format check (prettier)
        run: npm run lint

      - name: design/ is a frozen reference, never imported by site code
        # See design/README.md: the mock is a gold-standard visual reference,
        # not a dependency. This mirrors the guardrail already noted in
        # design/README.md's "Forward pointers" section. Scoped to actual
        # import syntax in code files, not prose links in .md/.mdx content
        # (both index.mdx and brand.mdx legitimately link to design/ for
        # attribution/context).
        run: |
          hits=$(grep -rlE "from ['\"][^'\"]*design/|import\(['\"][^'\"]*design/" \
            --include='*.astro' --include='*.ts' --include='*.mjs' --include='*.js' src/ 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "site/src code must never import from design/:"
            echo "$hits"
            exit 1
          fi

      - name: Lab TS types are up to date (no drift)
        # Same "generate, commit, CI diffs" pattern as spec/cst-schema.json /
        # spec/ir-schema.json — regenerate from spec/lab-protocol-schema.json
        # and fail if the committed src/lab/protocol.ts disagrees.
        run: |
          npm run gen:lab-types
          git diff --exit-code src/lab/protocol.ts

      - name: Build the Lab engine (Scala.js, optimized)
        # docs/playground-spec.md's "Worker bundle: placeholder locally, CI
        # builds the real one" — fullLinkJS, not the fastLinkJS local dev
        # uses, into public/lab/engine.mjs (gitignored, never committed).
        run: npm run build:engine -- --full

      - name: JVM<->JS parity gate (§8)
        # Runs a fixed LabRequest fixture list through labJVM (sbt runMain)
        # and through the just-built public/lab/engine.mjs under Node,
        # byte-comparing the serialized LabResponse — plus ajv-validates
        # each against spec/lab-protocol-schema.json.
        run: npm run check:lab-parity

      - name: atn-ts backend parity gate (all-star-port-plan.md Phase 5)
        # Runs the conformance corpus through `gramaire emit --backend atn-ts
        # --strategy ll-star` (sbt runMain), transpiles the emitted TS with
        # tsc, and runs it under Node — proving the emitted ATN recognizer,
        # not just its golden text, actually accepts/rejects like
        # Ll.recognize on every vector.
        run: npm run check:atn-ts-parity

      - name: Build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual regression (against committed baselines)
        run: npm run test:visual
