name: Deploy Gramaire docs

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments: rapid pushes queue rather than collide.
# `actions/deploy-pages` rejects a deployment while another is in progress
# ("cancel … first or wait"), which is what failed earlier; this group makes a
# later run wait for the in-flight one instead of erroring. Not cancel-in-progress
# — a production deploy should finish (GitHub's recommended Pages setting).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install deps
        working-directory: site
        run: npm install
      - name: Build site
        working-directory: site
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
