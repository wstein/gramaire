<svg xmlns="http://www.w3.org/2000/svg" width="600" height="66" viewBox="0 0 600 66" role="img" aria-label="Railroad diagram for the argActionBlock rule"><style>.rr-track{fill:none;stroke:#6B7280;stroke-width:2.5}.rr-term{fill:#fff;stroke:#15B879;stroke-width:2.5}.rr-nonterm{fill:#F5F6F3;stroke:#16181D;stroke-width:2.5}.rr-text{fill:#16181D;font:14px 'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-feature-settings:"liga" 1,"calt" 1;}.rr-action-text{fill:#6B7280;font:14px 'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-style:italic;font-feature-settings:"liga" 1,"calt" 1;}.rr-cap{fill:#16181D}</style><circle class="rr-cap" cx="18" cy="33" r="4"/><circle class="rr-cap" cx="582" cy="33" r="4"/><path class="rr-track" d="M18 33 H34"/><path class="rr-track" d="M566 33 H582"/><path class="rr-track" d="M34 33 H62"/><g class="rr-node rr-node-term" data-rr-kind="terminal" data-rr-label="BEGIN_ARGUMENT"><title>terminal: BEGIN_ARGUMENT</title><rect class="rr-term" x="62" y="18" width="143" height="30" rx="15"/><text class="rr-text" x="133.5" y="33" text-anchor="middle" dominant-baseline="central">BEGIN_ARGUMENT</text></g><path class="rr-track" d="M205 33 H229"/><g class="rr-node rr-node-term" data-rr-kind="terminal" data-rr-label="ARGUMENT_CONTENT"><title>terminal: ARGUMENT_CONTENT</title><rect class="rr-term" x="229" y="18" width="159" height="30" rx="15"/><text class="rr-text" x="308.5" y="33" text-anchor="middle" dominant-baseline="central">ARGUMENT_CONTENT</text></g><path class="rr-track" d="M388 33 H412"/><g class="rr-node rr-node-term" data-rr-kind="terminal" data-rr-label="END_ARGUMENT"><title>terminal: END_ARGUMENT</title><rect class="rr-term" x="412" y="18" width="126" height="30" rx="15"/><text class="rr-text" x="475" y="33" text-anchor="middle" dominant-baseline="central">END_ARGUMENT</text></g><path class="rr-track" d="M538 33 H566"/></svg>
