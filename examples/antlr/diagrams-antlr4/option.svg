<svg xmlns="http://www.w3.org/2000/svg" width="477" height="66" viewBox="0 0 477 66" role="img" aria-label="Railroad diagram for the option rule"><style>.rr-track{fill:none;stroke:#6B7280;stroke-width:2.5}.rr-term{fill:#fff;stroke:#15B879;stroke-width:2.5}.rr-nonterm{fill:#F5F6F3;stroke:#16181D;stroke-width:2.5}.rr-text{fill:#16181D;font:14px 'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-feature-settings:"liga" 1,"calt" 1;}.rr-action-text{fill:#6B7280;font:14px 'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-style:italic;font-feature-settings:"liga" 1,"calt" 1;}.rr-cap{fill:#16181D}</style><circle class="rr-cap" cx="18" cy="33" r="4"/><circle class="rr-cap" cx="459" cy="33" r="4"/><path class="rr-track" d="M18 33 H34"/><path class="rr-track" d="M443 33 H459"/><path class="rr-track" d="M34 33 H62"/><g class="rr-node rr-node-nonterm" data-rr-kind="nonterminal" data-rr-label="identifier"><title>nonterminal: identifier</title><rect class="rr-nonterm" x="62" y="18" width="110" height="30" rx="8"/><text class="rr-text" x="117" y="33" text-anchor="middle" dominant-baseline="central">identifier</text></g><path class="rr-track" d="M172 33 H196"/><g class="rr-node rr-node-term" data-rr-kind="terminal" data-rr-label="ASSIGN"><title>terminal: ASSIGN</title><rect class="rr-term" x="196" y="18" width="77" height="30" rx="15"/><text class="rr-text" x="234.5" y="33" text-anchor="middle" dominant-baseline="central">ASSIGN</text></g><path class="rr-track" d="M273 33 H297"/><g class="rr-node rr-node-nonterm" data-rr-kind="nonterminal" data-rr-label="optionValue"><title>nonterminal: optionValue</title><rect class="rr-nonterm" x="297" y="18" width="118" height="30" rx="8"/><text class="rr-text" x="356" y="33" text-anchor="middle" dominant-baseline="central">optionValue</text></g><path class="rr-track" d="M415 33 H443"/></svg>
