<svg xmlns="http://www.w3.org/2000/svg" width="494" height="66" viewBox="0 0 494 66" role="img" aria-label="Railroad diagram for the labeledElement rule"><style>.rr-track{fill:none;stroke:#6B7280;stroke-width:2.5}.rr-term{fill:#fff;stroke:#15B879;stroke-width:2.5}.rr-nonterm{fill:#F5F6F3;stroke:#16181D;stroke-width:2.5}.rr-text{fill:#16181D;font:14px 'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-feature-settings:"liga" 1,"calt" 1;}.rr-action-text{fill:#6B7280;font:14px 'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-style:italic;font-feature-settings:"liga" 1,"calt" 1;}.rr-cap{fill:#16181D}.rr-arrow{fill:#6B7280}</style><circle class="rr-cap" cx="18" cy="33" r="4"/><circle class="rr-cap" cx="476" cy="33" r="4"/><path class="rr-track" d="M18 33 H34"/><path class="rr-track" d="M460 33 H476"/><path class="rr-track" d="M34 33 H62"/><g class="rr-node rr-node-nonterm" data-rr-kind="nonterminal" data-rr-label="identifier"><title>nonterminal: identifier</title><rect class="rr-nonterm" x="62" y="18" width="110" height="30" rx="8"/><text class="rr-text" x="117" y="33" text-anchor="middle" dominant-baseline="central">identifier</text></g><path class="rr-track" d="M172 33 H196"/><g class="rr-node rr-node-nonterm" data-rr-kind="nonterminal" data-rr-label="assignOp"><title>nonterminal: assignOp</title><rect class="rr-nonterm" x="196" y="18" width="94" height="30" rx="8"/><text class="rr-text" x="243" y="33" text-anchor="middle" dominant-baseline="central">assignOp</text></g><path class="rr-track" d="M290 33 H314"/><g class="rr-node rr-node-nonterm" data-rr-kind="nonterminal" data-rr-label="atomOrBlock"><title>nonterminal: atomOrBlock</title><rect class="rr-nonterm" x="314" y="18" width="118" height="30" rx="8"/><text class="rr-text" x="373" y="33" text-anchor="middle" dominant-baseline="central">atomOrBlock</text></g><path class="rr-track" d="M432 33 H460"/></svg>
