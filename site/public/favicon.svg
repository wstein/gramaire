<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Gramark logomark">
  <title>Gramark logomark</title>
  <style>
    /* One file, both themes: dark ink on light backgrounds, off-white on dark.
       The emerald rule-node is constant across themes. Geometry matches the
       gold-standard interactive mock exactly (design/gramark-site-handoff/
       GramarkMark.dc.html) — no terminal dots, transform-scaled coordinates. */
    .ink { stroke: #16181d; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #eaf2ed; }
    }
  </style>
  <g transform="matrix(1.3665595,0,0,1.3665595,-17.594856,-17.594856)" fill="none" class="ink" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 18,48 H 33"/>
    <path d="M 63,48 C 70,48 71,31 78,31"/>
    <path d="M 63,48 C 70,48 71,65 78,65"/>
    <rect x="33" y="36" width="30" height="24" rx="12" fill="#15b879" class="ink" stroke-width="6"/>
  </g>
</svg>
