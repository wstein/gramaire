<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gramark">
  <title>Gramark</title>
  <!-- Theme-reactive via prefers-color-scheme (GitHub/OS honor this on an
       embedded SVG), so one file replaces the old light/dark file pair. -->
  <style>
    .gramark-ink { stroke: #16181D; }
    @media (prefers-color-scheme: dark) {
      .gramark-ink { stroke: #F5F6F3; }
    }
  </style>
  <!-- track: entry, then a fork into two alternatives -->
  <g class="gramark-ink" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 48 H33"/>
    <path d="M63 48 C72 48 74 31 82 31"/>
    <path d="M63 48 C72 48 74 65 82 65"/>
  </g>
  <!-- the rule node (railroad "station" / stadium) — always emerald, never recolored -->
  <rect x="33" y="36" width="30" height="24" rx="12" fill="#15B879" class="gramark-ink" stroke-width="6"/>
</svg>
