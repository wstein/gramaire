<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Gramark logomark">
  <title>Gramark logomark</title>
  <style>
    /* One file, both themes: dark ink on light backgrounds, off-white on dark.
       The emerald rule-node is constant across themes. */
    .ink { stroke: #16181d; }
    .dot { fill: #16181d; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f5f6f3; }
      .dot { fill: #f5f6f3; }
    }
  </style>
  <g fill="none" class="ink" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 48 H28"/>
    <path d="M62 48 C72 48 73 13 85 13"/>
    <path d="M62 48 C72 48 73 83 85 83"/>
  </g>
  <circle cx="11" cy="48" r="5" class="dot"/>
  <circle cx="85" cy="13" r="5" class="dot"/>
  <circle cx="85" cy="83" r="5" class="dot"/>
  <rect x="26" y="30" width="36" height="36" rx="18" fill="#15B879" class="ink" stroke-width="7.5"/>
</svg>
