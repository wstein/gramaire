<svg viewBox="0 0 372 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gramaire">
  <title>Gramaire</title>
  <!-- Theme-reactive via prefers-color-scheme, so one file replaces the old
       light/dark file pair. Split-stem "m": a hard-stop gradient bisects the
       one glyph where "gram"mar and "mark"(down) overlap — see docs/BRANDING.md. -->
  <style>
    .gramaire-ink { stroke: #16181D; }
    .gramaire-ink-fill { fill: #16181D; }
    .gramaire-accent-fill { fill: #15B879; }
    .gramaire-m-fill { fill: url(#gramaire-m-split-light); }
    @media (prefers-color-scheme: dark) {
      .gramaire-ink { stroke: #F5F6F3; }
      .gramaire-ink-fill { fill: #F5F6F3; }
      .gramaire-accent-fill { fill: #2DD597; }
      .gramaire-m-fill { fill: url(#gramaire-m-split-dark); }
    }
  </style>
  <defs>
    <linearGradient id="gramaire-m-split-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16181D"/>
      <stop offset="50%" stop-color="#16181D"/>
      <stop offset="50%" stop-color="#15B879"/>
      <stop offset="100%" stop-color="#15B879"/>
    </linearGradient>
    <linearGradient id="gramaire-m-split-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5F6F3"/>
      <stop offset="50%" stop-color="#F5F6F3"/>
      <stop offset="50%" stop-color="#2DD597"/>
      <stop offset="100%" stop-color="#2DD597"/>
    </linearGradient>
  </defs>
  <!-- logomark, scaled -->
  <g transform="translate(6 17) scale(0.70)">
    <g class="gramaire-ink" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 48 H33"/>
      <path d="M63 48 C72 48 74 31 82 31"/>
      <path d="M63 48 C72 48 74 65 82 65"/>
    </g>
    <rect x="33" y="36" width="30" height="24" rx="12" fill="#15B879" class="gramaire-ink" stroke-width="6"/>
  </g>
  <!-- wordmark: "Gra" (ink) + split-stem "m" (ink|emerald) + "ark" (emerald) -->
  <text x="92" y="65" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">
    <tspan class="gramaire-ink-fill">Gra</tspan><tspan class="gramaire-m-fill">m</tspan><tspan class="gramaire-accent-fill">ark</tspan>
  </text>
</svg>
